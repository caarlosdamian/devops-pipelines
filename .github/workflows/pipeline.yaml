name: ci pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout

    - name: Set up Node js
      uses: actions/setup-node@v3
      with:
        no-version: 24

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test
